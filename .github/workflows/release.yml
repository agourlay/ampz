name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: xyzzylabs/setup-zig@c0fdcf100ed8a4e5619d2bf55fae0bf0dab9ba0a # v1.0.7
        with:
          version: 0.17.1
      - name: Package Linux binaries
        run: |
          mkdir -p dist
          for arch in x86_64 aarch64; do
            pkg="ampz-$arch-linux"
            zig build "-Dtarget=$arch-linux-musl" -Dcpu=baseline --prefix "$RUNNER_TEMP/$pkg"
            folder="ampz-${GITHUB_REF_NAME}-$arch-linux"
            mkdir -p "$RUNNER_TEMP/package/$folder"
            cp "$RUNNER_TEMP/$pkg/bin/ampz" "$RUNNER_TEMP/package/$folder/"
            cp --parents README.md LICENSE ampz.png src/assets/playhead.svg config.json src/fonts/LICENSE.txt "$RUNNER_TEMP/package/$folder/"
            tar -czf "dist/$pkg.tar.gz" -C "$RUNNER_TEMP/package" "$folder"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*
