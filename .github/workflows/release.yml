name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: xyzzylabs/setup-zig@c0fdcf100ed8a4e5619d2bf55fae0bf0dab9ba0a # v1.0.7
        with:
          version: 0.17.1
      - name: Build Linux binaries
        run: |
          for arch in x86_64 aarch64; do
            zig build "-Dtarget=$arch-linux-musl" -Dcpu=baseline
            cp zig-out/bin/ampz "ampz-$arch-linux"
          done
      - name: Upload binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" ampz-x86_64-linux ampz-aarch64-linux --clobber
