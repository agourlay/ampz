name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: xyzzylabs/setup-zig@c0fdcf100ed8a4e5619d2bf55fae0bf0dab9ba0a # v1.0.7
        with:
          version: 0.17.1
      - name: Check formatting
        run: zig fmt --check build.zig build.zig.zon src
      - name: Lint
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 --output zlint https://github.com/DonIsaac/zlint/releases/download/v0.10.0/zlint-linux-x86_64
          echo '0b331646d5e40bec3cfcb0694c5da0b13b9de8b10af12937a777ab3144b70b65  zlint' | sha256sum --check
          chmod +x zlint
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/zlint" --deny-warnings
      - name: Build
        run: zig build --summary all
      - name: Test
        run: zig build test --summary all
